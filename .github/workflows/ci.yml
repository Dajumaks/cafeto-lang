name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Run sample program
        run: swift run cafeto --no-tokens examples/01_condicionales.txt